{% extends 'base.html' %}
{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

<style>
    /* Hilangkan instruksi teks default leaflet routing agar rapi di mobile */
    .leaflet-routing-container {
        display: none !important;
    }

    /* Pastikan container map memiliki tinggi yang cukup */
    #map {
        height: 100%;
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
    }

    /* Pastikan body dan html juga memiliki tinggi 100% */
    html,
    body {
        height: 100%;
        margin: 0;
        padding: 0;
    }

    /* Pastikan container utama mengambil full height */
    .h-screen {
        height: 100vh;
    }
</style>

<div class="h-screen flex flex-col relative bg-gray-100">
    <div id="map" class="absolute inset-0 z-0"></div>

    <div class="absolute top-0 left-0 right-0 p-4 z-10">
        <div class="bg-white/90 backdrop-blur-md shadow-lg rounded-2xl p-4 flex items-center gap-3">
            <a href="{{ url_for('courier_dashboard') }}"
                class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center text-dark hover:bg-gray-200">
                <i class="fas fa-arrow-left"></i>
            </a>
            <div class="flex-1">
                <h2 class="font-bold text-sm text-dark">Terdapat 3 Pesanan</h2>
                <p class="text-xs text-gray-500"></p>
            </div>
            <div class="bg-primary text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm">
                Tersedia
            </div>
        </div>
    </div>

    <div class="absolute bottom-0 left-0 right-0 p-6 z-10">
        <div class="bg-white rounded-2xl shadow-[0_-5px_20px_rgba(0,0,0,0.1)] p-5">
            <div class="flex items-center gap-4 mb-4">
                <div class="bg-green-100 p-3 rounded-full text-green-600">
                    <i class="fas fa-map-marker-alt text-xl"></i>
                </div>
                <div>
                    <p class="text-[10px] text-gray-400">Estimasi Selesai</p>
                    <h3 class="font-bold text-lg text-dark">20 Menit <span
                            class="text-xs font-normal text-gray-500">(3.2 km)</span></h3>
                </div>
            </div>


            <a href="{{ url_for('courier_dashboard') }}"
                class="block w-full bg-primary hover:bg-lime-500 text-dark font-bold py-4 rounded-xl text-center shadow-lg shadow-lime-500/30 transition">
                Kembali ke Dashboard
            </a>
        </div>
    </div>
</div>

<script>
    // Koordinat Hardcode untuk Demo (Area Renon, Denpasar)
    const startLat = -8.656779;
    const startLng = 115.212557; // Posisi Awal (Pasar Badung)

    // Tiga lokasi tujuan dengan rute alami
    const destinations = [
        { lat: -8.658502, lng: 115.212031, name: "Rumah 1" },
        { lat: -8.658314, lng: 115.208683, name: "Rumah 2" },
        { lat: -8.657209, lng: 115.208258, name: "Rumah 3" },
    ];

    // Inisialisasi Map
    var map = L.map('map', { zoomControl: false }).setView([startLat, startLng], 13);

    // Tambahkan Tile Layer (Peta Jalan) - OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Icon untuk kurir (titik awal)
    const courierIcon = L.divIcon({
        html: `
            <div style="
                background: #3b82f6;
                width: 40px;
                height: 40px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                border: 2px solid white;
                box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            ">
                <i class="fas fa-motorcycle"></i>
            </div>
        `,
        className: 'courier-marker',
        iconSize: [40, 40],
        iconAnchor: [20, 20]
    });

    // Icon untuk rumah pelanggan
    const customerIcon = L.divIcon({
        html: `
            <div style="
                background: #10b981;
                width: 40px;
                height: 40px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                border: 2px solid white;
                box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            ">
                <i class="fas fa-home"></i>
            </div>
        `,
        className: 'customer-marker',
        iconSize: [40, 40],
        iconAnchor: [20, 20]
    });

    // Buat waypoints untuk rute
    const waypoints = [
        L.latLng(startLat, startLng)  // Titik awal
    ];

    // Tambahkan semua tujuan ke waypoints
    destinations.forEach(dest => {
        waypoints.push(L.latLng(dest.lat, dest.lng));
    });

    // Buat rute dengan multiple waypoints
    L.Routing.control({
        waypoints: waypoints,
        routeWhileDragging: false,
        lineOptions: {
            styles: [{ color: '#3b82f6', opacity: 0.8, weight: 6 }]
        },
        createMarker: function (i, waypoint, n) {
            // Marker Awal (Kurir)
            if (i === 0) {
                return L.marker(waypoint.latLng, { icon: courierIcon })
                    .bindPopup("Posisi Anda (Kurir)");
            }
            // Marker Tujuan (Rumah Pelanggan)
            const dest = destinations[i - 1]; // -1 karena waypoint pertama adalah posisi awal
            return L.marker(waypoint.latLng, { icon: customerIcon })
                .bindPopup(`<b>${dest.name}</b><br>${dest.lat.toFixed(6)}, ${dest.lng.toFixed(6)}`);
        },
        show: false
    }).addTo(map);

    // Hitung total jarak dan waktu tempuh
    const totalDistance = 3.2; // dalam km
    const totalTime = 20; // dalam menit

    // Update UI dengan total jarak dan waktu
    document.querySelector('.text-lg').textContent = `${totalTime} Menit `;
    document.querySelector('.text-xs').textContent = `(${totalDistance} km)`;
</script>
{% endblock %}
